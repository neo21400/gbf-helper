<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/vendor/inter/inter.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        #sidebar {
            width: 145px;
            min-width: 145px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-track { background: #1a1a1a; }
        #sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .sidebar-header {
            padding: 10px 10px 6px;
            font-size: 10px;
            font-weight: 600;
            color: #0288d1;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid #222;
        }

        /* Category toggle */
        .cat-btn {
            width: 100%;
            background: none;
            border: none;
            color: #aaa;
            font-size: 11px;
            font-family: inherit;
            padding: 7px 10px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s, background 0.15s;
        }
        .cat-btn:hover { background: #222; color: #ddd; }
        .cat-btn .arrow {
            font-size: 9px;
            transition: transform 0.2s;
            color: #555;
            flex-shrink: 0;
        }
        .cat-btn.open .arrow { transform: rotate(90deg); color: #0288d1; }
        .cat-btn.open { color: #ddd; }

        .cat-group { border-bottom: 1px solid #1f1f1f; }

        /* Sub-items container */
        .cat-children {
            display: none;
            background: #161616;
        }
        .cat-children.visible { display: block; }

        /* Raid buttons */
        .raid-btn {
            width: 100%;
            background: none;
            border: none;
            color: #999;
            font-size: 11px;
            font-family: inherit;
            padding: 6px 10px 6px 22px;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-left: 2px solid transparent;
        }
        .raid-btn:hover { background: #1e1e1e; color: #ddd; }
        .raid-btn.active {
            background: rgba(2,136,209,0.12);
            color: #b3e5fc;
            border-left-color: #0288d1;
        }

        /* Nested sub-category */
        .sub-cat-btn {
            width: 100%;
            background: none;
            border: none;
            color: #777;
            font-size: 10px;
            font-family: inherit;
            padding: 5px 10px 5px 16px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.15s;
        }
        .sub-cat-btn:hover { color: #bbb; }
        .sub-cat-btn .arrow { font-size: 8px; transition: transform 0.2s; color: #444; }
        .sub-cat-btn.open .arrow { transform: rotate(90deg); }

        .sub-cat-children { display: none; }
        .sub-cat-children.visible { display: block; }
        .sub-cat-children .raid-btn { padding-left: 30px; }

        /* ── Main content ── */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #raid-header {
            padding: 10px 14px 8px;
            border-bottom: 1px solid #222;
            background: #181818;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #raid-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            flex: 1;
        }

        #btn-fav {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
        }
        #btn-fav:hover { color: #f39c12; background: #2a2a2a; }
        #btn-fav.active { color: #f39c12; }

        #btn-rename {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 4px;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
        }
        #btn-rename:hover { color: #aaa; background: #2a2a2a; }

        /* Pin rows */
        #pin-area {
            padding: 6px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
            background: #181818;
            border-bottom: 1px solid #1e1e1e;
        }
        .pin-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 14px;
        }
        .pin-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #242424;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            color: #ccc;
            cursor: context-menu;
        }
        .pin-item:hover { border-color: #555; }
        .pin-item img { width: 20px; height: 20px; border-radius: 2px; }

        /* Action buttons */
        #action-bar {
            padding: 6px 14px;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            border-bottom: 1px solid #1e1e1e;
            background: #181818;
        }

        .action-btn {
            padding: 4px 12px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #222;
            color: #aaa;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .action-btn:hover { background: #2c2c2c; color: #ddd; border-color: #444; }
        .action-btn.danger:hover { background: rgba(183,28,28,0.3); color: #ff8a80; border-color: #c62828; }

        /* Loot content */
        #loot-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px;
        }
        #loot-content::-webkit-scrollbar { width: 5px; }
        #loot-content::-webkit-scrollbar-track { background: #121212; }
        #loot-content::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
        #loot-content::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

        #no-loot-msg {
            color: #444;
            font-size: 13px;
            text-align: center;
            margin-top: 30px;
        }

        #raid-info {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .kill-count {
            grid-column: 1 / -1;
            font-size: 11px;
            color: #666;
            margin-bottom: -6px; /* Offset gap slightly for title */
            font-weight: 500;
        }
        .kill-count span { color: #0288d1; font-size: 13px; }

        /* Loot section */
        .favorite-raid-card {
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }
        .favorite-raid-header {
            background: #222;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .favorite-raid-body {
            padding: 10px 14px;
        }

        .loot-section {
            /* gap handles spacing */
        }

        .loot-section-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #555;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .loot-section-title:hover { color: #888; }
        .loot-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #222;
        }
        .loot-section-title .count-badge {
            font-size: 10px;
            background: rgba(2,136,209,0.1);
            color: #0288d1;
            border-radius: 10px;
            padding: 1px 6px;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
        }
        .loot-section-title .section-collapse-arrow {
            font-size: 9px;
            color: #555;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .loot-section.collapsed .section-collapse-arrow { transform: rotate(-90deg); }
        .loot-section-body {
            display: flex;
            flex-direction: column;
        }
        .loot-section.collapsed .loot-section-body { display: none; }

        /* Item rows */
        .item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.1s;
            cursor: default;
        }
        .item-row:hover { background: #1a1a1a; }
        .item-row.has-details { cursor: pointer; }

        .item-img {
            width: 30px;
            height: 30px;
            border-radius: 3px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .item-name {
            flex: 1;
            color: #bbb;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-count { color: #aaa; font-size: 11px; min-width: 40px; text-align: right; }
        .item-pct {
            font-size: 10px;
            color: #555;
            min-width: 40px;
            text-align: right;
        }

        .item-expand { color: #444; font-size: 10px; transition: transform 0.2s; margin-left: 2px; }
        .item-row.open .item-expand { transform: rotate(90deg); }

        .item-details {
            display: none;
            background: #161616;
            border-left: 2px solid #2a2a2a;
            margin: 0 6px 4px 44px;
            padding: 4px 8px;
            border-radius: 0 4px 4px 0;
        }
        .item-details.visible { display: block; }
        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #666;
            padding: 1px 0;
        }

        /* Context menu */
        #pin-item-menu {
            display: none;
            position: fixed;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 9999;
            overflow: hidden;
            min-width: 140px;
        }
        .pin-menu-btn {
            width: 100%;
            background: none;
            border: none;
            color: #bbb;
            font-size: 11px;
            font-family: inherit;
            padding: 8px 14px;
            text-align: left;
            cursor: pointer;
            transition: background 0.15s;
        }
        .pin-menu-btn:hover { background: #2a2a2a; color: #fff; }
    </style>
    <title>GBF Loot Tracker</title>
    <script src="loot.js"></script>
</head>
