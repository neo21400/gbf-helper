<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>GBF Helper — Gacha Tracker</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      font-size: 13px;
      /* Выпадающие списки и чекбоксы браузер рисует сам — так он делает это в
         тёмных тонах, а не белым поверх тёмного окна */
      color-scheme: dark;
    }
    body::-webkit-scrollbar { width: 5px; }
    body::-webkit-scrollbar-track { background: #121212; }
    body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    body::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }

    h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0288d1;
      margin: 0 0 12px;
      letter-spacing: 0.3px;
    }

    /* ── Период ─────────────────────────────────────────── */
    .period {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .period-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .period-title { font-size: 14px; font-weight: 600; color: #fff; }
    .period-dates { font-size: 11px; color: #777; margin-top: 2px; }

    .head-right { display: flex; align-items: center; gap: 8px; }
    .btn-img { padding: 3px 8px; font-size: 11px; }

    .badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .badge-live { background: rgba(76,175,80,0.15); color: #6abf6e; border: 1px solid #2d4a2d; }
    .badge-past { background: #1e1e1e; color: #666; border: 1px solid #2a2a2a; }

    /* ── Прогресс к спарку ──────────────────────────────── */
    .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .bar {
      flex: 1;
      height: 8px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      overflow: hidden;
    }
    .fill { height: 100%; background: #0288d1; transition: width 0.2s; }
    .fill.full { background: #4caf50; }
    .progress-num { font-size: 12px; color: #0288d1; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Сводка ─────────────────────────────────────────── */
    .summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11.5px;
      color: #bbb;
    }
    .chip.dim { color: #777; }

    .gap {
      background: rgba(201,168,76,0.08);
      border: 1px solid #4a4327;
      border-radius: 4px;
      padding: 7px 9px;
      font-size: 11.5px;
      color: #c9a84c;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .nothing { color: #555; font-style: italic; padding: 4px 0; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #0288d1;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 10px 0 6px;
    }
    .section-label.dim { color: #555; }

    /* ── Колонки категорий ──────────────────────────────── */
    /* Раскладываются в JS (layoutSections), как в трекере лута: у грида высота
       строки равна самой высокой категории, и под короткой зияла бы дыра */
    .gacha-columns {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .gacha-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .gacha-col .section-label { margin-top: 0; }

    /* ── Персонажи ──────────────────────────────────────── */
    /* Карточка фиксированной ширины: тянущиеся картинки на широком окне
       раздувались до полуэкранных, а сама категория всё равно шла вниз */
    .char-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .char {
      width: 150px;
      flex: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      overflow: hidden;
    }
    .char img {
      display: block;
      width: 100%;
      /* Все картинки на CDN игры 280x160 — держим место до их загрузки,
         иначе колонки раскладываются по одной высоте, а рисуются по другой */
      aspect-ratio: 280 / 160;
      height: auto;
      background: #111;
    }
    .char-noimg {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 280 / 160;
      color: #666;
      font-size: 11px;
      text-align: center;
      padding: 0 8px;
      background: #111;
    }
    .char-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 8px;
    }
    .char-name { color: #ffd54f; font-weight: 600; font-size: 12.5px; }
    .char-sub { color: #666; font-size: 10.5px; }
    .char .tag-new { align-self: flex-start; margin-top: 2px; }

    .tag-new {
      background: rgba(2,136,209,0.2);
      color: #4fc3f7;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
    }

    .minor { color: #666; font-size: 11.5px; margin-top: 8px; }

    /* ── Спарк ──────────────────────────────────────────── */
    .spark {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #222;
    }
    .spark > label { color: #888; font-size: 12px; white-space: nowrap; }
    .spark-field { position: relative; flex: 1; min-width: 0; display: flex; }
    .spark-field input {
      flex: 1;
      min-width: 0;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ddd;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
    }
    .spark-field input:focus { outline: none; border-color: #0288d1; }

    .spark-new {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #888;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }
    .spark-new input { accent-color: #0288d1; width: 14px; height: 14px; margin: 0; cursor: pointer; }

    /* Свой список подсказок: нативный <datalist> рисует браузер, и в тёмном
       окне он выглядит чужеродно */
    .suggest {
      position: absolute;
      top: calc(100% + 3px);
      left: 0;
      right: 0;
      z-index: 20;
      max-height: 190px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    }
    .suggest::-webkit-scrollbar { width: 5px; }
    .suggest::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    .suggest-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 9px;
      font-size: 12px;
      color: #ddd;
      cursor: pointer;
    }
    .suggest-item:hover, .suggest-item.active { background: #232323; color: #fff; }
    .suggest-kind { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; }

    .empty { text-align: center; color: #444; padding: 34px 0; line-height: 1.6; }

    /* ── Отладка ────────────────────────────────────────── */
    .debug { margin-top: 18px; border-top: 1px solid #222; padding-top: 10px; }
    .debug-toggle {
      background: none;
      border: none;
      color: #555;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
    }
    .debug-toggle:hover { color: #888; }
    .debug-body { margin-top: 10px; }
    .debug-body .hint { color: #666; font-size: 11.5px; line-height: 1.5; margin: 0 0 10px; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    label.check { display: flex; align-items: center; gap: 7px; cursor: pointer; color: #aaa; font-size: 12px; }
    label.check input { accent-color: #0288d1; width: 15px; height: 15px; }
    .btn {
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 5px 11px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: #2c2c2c; color: #ddd; border-color: #444; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    #stats { font-size: 11px; color: #666; margin-left: auto; }

    /* ── Скачать/загрузить историю ───────────────────────── */
    #history-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    #history-status { font-size: 11px; color: #666; }
    #history-status.failed { color: #f08080; }

    /* ── Переключатель вида ──────────────────────────────── */
    #view-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    #view-bar .view-label { font-size: 11px; color: #666; }
    /* Своя стрелка вместо системной: с appearance:none поле рисуем целиком мы,
       а color-scheme на body заставляет Chrome открывать и сам список тёмным */
    #view-bar select {
      background-color: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 22px 4px 8px;
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 6px center;
      background-size: 10px;
    }
    #view-bar select:hover { background-color: #2c2c2c; color: #ddd; border-color: #444; }
    #view-bar select:focus { outline: none; border-color: #0288d1; }
  </style>
</head>
<body>
  <h1>Gacha Tracker</h1>

  <div id="history-bar">
    <button class="btn" id="btn-history-download" disabled>⬇ Download</button>
    <button class="btn" id="btn-history-upload">⬆ Upload</button>
    <input type="file" id="history-file" accept=".json" hidden>
    <span id="history-status"></span>

    <span id="view-bar">
      <span class="view-label">View:</span>
      <select id="view-sort" title="How drops are ordered">
        <option value="type">By type</option>
        <option value="drawn">Order drawn</option>
      </select>
      <select id="view-layout" title="How categories are laid out">
        <option value="columns">Columns</option>
        <option value="rows">Rows</option>
      </select>
    </span>
  </div>

  <div id="periods"></div>

  <div class="debug">
    <button class="debug-toggle" id="debug-toggle">Debug ▸</button>
    <div class="debug-body" id="debug-body" hidden>
      <p class="hint">
        Draws are recorded automatically — this log is only for troubleshooting.
        It stores raw game responses under <code>/gacha/</code>, which include your
        account ID, so review the file before sharing it.
      </p>
      <div class="row">
        <label class="check"><input type="checkbox" id="chk-capture"> Record raw log</label>
        <button class="btn" id="btn-export" disabled>⬇ Export</button>
        <button class="btn" id="btn-clear" disabled>🗑 Clear</button>
        <span id="stats">0 entries</span>
      </div>
    </div>
  </div>

  <script src="gacha-image.js"></script>
  <script src="gacha.js"></script>
</body>
</html>
